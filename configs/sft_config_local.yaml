# SFT Local Validation Configuration
# Target: RTX 4090 (24GB VRAM) + Qwen2.5-1.5B-Instruct
# Purpose: Pipeline validation before cloud 7B training

model_name: "Qwen/Qwen2.5-3B-Instruct"
output_dir: "outputs/sft_local"
data_path: "outputs/data/sft_train.jsonl"

# LoRA (smaller rank for 0.5B)
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Training (optimized for RTX 4090 24GB)
num_epochs: 1
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 5.0e-5
lr_scheduler_type: cosine
warmup_steps: 20
max_seq_length: 4096
weight_decay: 0.01
bf16: true
gradient_checkpointing: true

# Evaluation (frequent for quick validation)
eval_split_ratio: 0.1
eval_steps: 10
save_steps: 30
logging_steps: 5
load_best_model_at_end: true
metric_for_best_model: "eval_loss"
diag_eval_episodes: 10  # Small Oracle eval for fast validation

# Data
dataset_format: "sharegpt"
