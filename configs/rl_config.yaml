# RL (GRPO) Training Configuration
model_name_or_path: "outputs/sft/best"
ref_model_name: "outputs/sft/best"
output_dir: "outputs/rl"

# GRPO parameters
group_size: 4
kl_coeff: 0.05
clip_range: 0.2
max_rollout_steps: 15
temperature: 0.8

# Training (optimized for RTX PRO 6000 96GB)
# Memory optimization: shared base model + adapter toggling saves ~14GB
num_train_steps: 500
per_device_batch_size: 1       # 1 prompt × 4 groups × multi-turn = high memory
gradient_accumulation_steps: 4
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
max_new_tokens: 512            # Reduced from 1024 (each turn < 200 tokens)

# Evaluation
eval_steps: 50
diag_eval_episodes: 30
save_steps: 50

# Reward weights
reward_weights:
  accuracy: 0.35
  efficiency: 0.20
  format: 0.15
  reasoning: 0.15
  completeness: 0.15

# Data
train_data_path: "outputs/data/rl_train.jsonl"
eval_data_path: "outputs/data/rl_val.jsonl"
